name: Verify mathematics and CLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 binaries are available for 24.04, not the newer latest image.
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m neural_math_lab gradient-check
      - run: python -m neural_math_lab train --output runs/ci
      - run: python -m neural_math_lab explain --model runs/ci/model.json --input 1 0
